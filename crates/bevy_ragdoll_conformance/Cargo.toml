[package]
name = "bevy_ragdoll_conformance"
description = "Shared mock backend and backend conformance checks for bevy-ragdoll"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["bevy", "ragdoll", "physics", "testing", "gamedev"]
categories = ["game-development", "simulation", "development-tools::testing"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_asset", "bevy_animation", "bevy_log"] }
bevy_ragdoll = { workspace = true, features = ["3d"] }

[lints]
workspace = true
