[workspace]
resolver = "3"
members = ["crates/bevy_ragdoll", "examples", "benches"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagan-software/bevy-ragdoll"

[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false }
bevy_transform = "=0.19.1"
bevy_rapier3d = "=0.36.0"
avian3d = "=0.7.0"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
thiserror = "2"
criterion = "0.8"
argh = "0.1"
rand_chacha = "0.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.stress-test]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
