[package]
name = "bevy_ragdoll"
description = "Active ragdolls for Bevy on any skeleton and physics engine"
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Criterion benches use `bench_main`; libtest would reject Criterion arguments.
bench = false

[features]
default = ["3d", "serialize", "debug"]
3d = []
2d = []
# Shape meshes for physics bodies through `RagdollDebugPlugin`.
debug = ["bevy/bevy_pbr"]
serialize = ["dep:ron", "dep:serde", "bevy/serialize"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_asset", "bevy_animation", "bevy_log"] }
ron = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
avian3d.workspace = true
bevy = { workspace = true, features = [
    "std",
    "3d",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "png",
    "x11",
] }
bevy_ragdoll_avian3d.workspace = true
bevy_ragdoll_conformance.workspace = true
bevy_ragdoll_rapier3d.workspace = true
bevy_rapier3d = { workspace = true, features = ["dim3"] }
clap.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true

# Criterion pulls Rayon, which does not build for wasm32; only `bench_main` uses it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

# The showcase reads `?backend=` from the page URL on the web.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { workspace = true, features = ["Location", "Window"] }

[[example]]
name = "showcase"
doc-scrape-examples = true

[package.metadata.example.showcase]
name = "Showcase"
description = "Throw, hit, and tune a crowd of ragdolls while watching frame and step cost."
category = "Showcase"
wasm = true

[[example]]
name = "minimal"
doc-scrape-examples = true

[package.metadata.example.minimal]
name = "Minimal"
description = "Drop the reference humanoid ragdoll and inspect its landing and joints."
category = "Basics"
wasm = true

[[example]]
name = "from_code"
doc-scrape-examples = true

[package.metadata.example.from_code]
name = "From Code"
description = "Build and run a pinned three-body chain from Rust."
category = "Basics"
wasm = true

[[example]]
name = "from_gltf"
doc-scrape-examples = true

[package.metadata.example.from_gltf]
name = "From glTF"
description = "Generate ragdolls from skinned glTF creatures with no authored files."
category = "Basics"
wasm = true

[[example]]
name = "profile_builder"
doc-scrape-examples = true

[package.metadata.example.profile_builder]
name = "Profile Builder"
description = "Build and validate a one-body profile without an app."
category = "Basics"
wasm = false

[[example]]
name = "custom_backend"
doc-scrape-examples = true

[package.metadata.example.custom_backend]
name = "Custom Backend"
description = "Run the core runtime on the approximate mock backend."
category = "Backends"
wasm = true

[[example]]
name = "hit_reactions"
doc-scrape-examples = true

[package.metadata.example.hit_reactions]
name = "Hit Reactions"
description = "Select hit profiles, click the rig, and edit local muscle and pin strengths."
category = "Active Control"
wasm = true

[[example]]
name = "partial_ragdoll"
doc-scrape-examples = true

[package.metadata.example.partial_ragdoll]
name = "Partial Ragdoll"
description = "Keep the legs driven while periodic impacts move the loose upper body."
category = "Active Control"
wasm = true

[[example]]
name = "ragdoll_stress"
required-features = ["serialize"]
test = true

[package.metadata.example.ragdoll_stress]
name = "Ragdoll Stress"
description = "Drop many ragdolls and report frame and physics-step cost."
category = "Stress Tests"
wasm = true

[[bench]]
name = "bench_main"
harness = false

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    ".",
    "crates/bevy_ragdoll_avian3d",
    "crates/bevy_ragdoll_conformance",
    "crates/bevy_ragdoll_rapier3d",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagan-software/bevy-ragdoll"

[workspace.dependencies]
# Local crates
bevy_ragdoll = { path = ".", version = "0.1.0-dev", default-features = false }
bevy_ragdoll_avian3d = { path = "crates/bevy_ragdoll_avian3d", version = "0.1.0-dev" }
bevy_ragdoll_conformance = { path = "crates/bevy_ragdoll_conformance", version = "0.1.0-dev" }
bevy_ragdoll_rapier3d = { path = "crates/bevy_ragdoll_rapier3d", version = "0.1.0-dev" }

# crates.io
avian3d = { version = "=0.7.0", default-features = false }
bevy = { version = "=0.19.1", default-features = false }
bevy_rapier3d = { version = "=0.36.0", default-features = false }
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8.2"
num-traits = "=0.2.19"
rand_chacha = "0.10"
rand_core = "0.10"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
web-sys = "0.3.106"

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/sagan-software/dylints", rev = "0ed03375bd1190a44720a68f189fd9ca5fdf6710", pattern = ["lints"] },
]

[workspace.lints.rust]
# Warnings and enforced checks.
absolute_paths_not_starting_with_crate = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
deprecated_safe_2024 = "warn"
deref_into_dyn_supertrait = "warn"
edition_2024_expr_fragment_specifier = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
if_let_rescope = "warn"
impl_trait_overcaptures = "warn"
impl_trait_redundant_captures = "warn"
keyword_idents_2018 = "warn"
keyword_idents_2024 = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = { level = "forbid", priority = 1 }
missing_unsafe_on_extern = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2021_incompatible_closure_captures = "warn"
rust_2021_incompatible_or_patterns = "warn"
rust_2021_prefixes_incompatible_syntax = "warn"
rust_2021_prelude_collisions = "warn"
rust_2024_guarded_string_incompatible_syntax = "warn"
rust_2024_incompatible_pat = "warn"
rust_2024_prelude_collisions = "warn"
single_use_lifetimes = "warn"
tail_expr_drop_order = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
unit_bindings = "warn"
unknown_lints = "deny"
unnameable_types = "warn"
unreachable_pub = { level = "warn", priority = 1 }
unsafe_attr_outside_unsafe = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

# Justified allowances.
# macOS linkers emit duplicate-library and SDK notices outside project control.
linker_messages = "allow"
# Feature-selected dependencies may be used only by a binary, test or benchmark.
unused_crate_dependencies = "allow"
# Bevy builder calls return chainable values that do not require consumption.
unused_results = "allow"

# Nightly-only checks are unavailable on the pinned stable compiler.
# multiple_supertrait_upcastable, unqualified_local_imports,
# must-not-suspend, non-exhaustive-omitted-patterns,
# supertrait-item-shadowing-definition, supertrait-item-shadowing-usage.
# These checks remain excluded until stable Rust supports them.

[workspace.lints.rustdoc]
# Warnings and enforced checks.
bare_urls = "warn"
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
# Warnings and enforced checks.
all = { level = "warn", priority = -1 }
allow_attributes = { level = "warn", priority = 2 }
allow_attributes_without_reason = { level = "warn", priority = 2 }
cargo = { level = "warn", priority = -1 }
cast_precision_loss = { level = "warn", priority = 1 }
collapsible_if = { level = "warn", priority = 1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
doc_markdown = "warn"
if_not_else = { level = "warn", priority = 1 }
indexing_slicing = { level = "warn", priority = 2 }
let_and_return = { level = "warn", priority = 1 }
match_same_arms = { level = "warn", priority = 1 }
missing_const_for_fn = { level = "warn", priority = 1 }
# Clap derives permit generated private items; authored private items remain denied.
missing_docs_in_private_items = { level = "deny", priority = 2 }
missing_errors_doc = "warn"
missing_fields_in_debug = { level = "warn", priority = 1 }
missing_panics_doc = "warn"
must_use_candidate = "warn"
nursery = { level = "warn", priority = -1 }
option_if_let_else = "warn"
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
redundant_closure_for_method_calls = { level = "warn", priority = 1 }
struct_excessive_bools = { level = "warn", priority = 1 }
struct_field_names = { level = "warn", priority = 1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
unnecessary_wraps = { level = "warn", priority = 1 }
unused_self = { level = "warn", priority = 1 }
use_self = { level = "warn", priority = 1 }
# Groups use priority -1; individual rules override groups at priority 1 or 2.

# Justified allowances.
# Bevy permits local futures that borrow thread-local ECS state.
future_not_send = { level = "allow", priority = 1 }
# Third-party plugins select different transitive dependency versions.
multiple_crate_versions = { level = "allow", priority = 1 }
# Bevy system parameters and plugin APIs consume values by framework contract.
needless_pass_by_value = "allow"
# Explicit crate visibility documents internal domain boundaries.
redundant_pub_crate = { level = "allow", priority = 1 }
# Enable individual restriction checks; the full group contains mutually exclusive policies.
restriction = { level = "allow", priority = -1 }
# Bevy resource and query guards often require the enclosing system scope.
significant_drop_tightening = { level = "allow", priority = 1 }
# Bevy systems declare independent ECS parameters.
too_many_arguments = "allow"
# Bevy queries express component access and filters in their type.
type_complexity = "allow"

# Bevy optimization profiles: https://bevy.org/learn/quick-start/getting-started/setup/
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[profile.stress-test]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
strip = "none"
