name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      # Formatting, Clippy, tests, cargo-deny, and Sagan Dylint.
      # Advisories use the latest RustSec database instead of the locked one.
      - run: nix flake check -L --override-input advisory-db github:rustsec/advisory-db

  stress-smoke:
    name: Stress smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: >-
          nix develop -c cargo run --example ragdoll_stress --features rapier3d --
          --headless --scenario pile --count 4 --duration 2 --warmup 0
          --report stress-smoke.json
      - run: >-
          python3 -c 'import json; from pathlib import Path; report =
          json.loads(Path("stress-smoke.json").read_text()); assert
          report["metrics"]["unstable_bodies"] == 0, report["metrics"]'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      # Writes lcov.info, html/, summary.json, and the Shields.io endpoint badge.json.
      - run: nix build .#coverage -L
      - run: cp -rL result coverage
      - run: >-
          jq -r '"Line coverage: \(.message)"' coverage/badge.json
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
